# ============================================================
# docker-compose.yml — AdsIQ Platform
# ============================================================
#
# 📖 WHAT IS THIS FILE?
# Docker Compose lets you define and run MULTIPLE containers
# with a single command: `docker compose up`
#
# Think of each "service" below as its own mini-server.
# They all talk to each other on a shared private network.
# ============================================================

# "version" tells Docker Compose which feature set to use.
# "3.9" is modern and supports all features we need.
version: "3.9"

# ============================================================
# SERVICES — Each service = one running container
# ============================================================
services:

  # ----------------------------------------------------------
  # 🗄️  SERVICE 1: PostgreSQL Database
  # ----------------------------------------------------------
  # PostgreSQL is our primary relational database.
  # It stores: campaigns, ad groups, ads, metrics, agent runs.
  #
  # In the Google Ads API world, you always need a persistent
  # store for campaign data, audit logs, and error histories.
  db:
    # "image" = the pre-built Docker image to use.
    # "postgres:16-alpine" means PostgreSQL version 16 on
    # Alpine Linux (a tiny 5MB OS — keeps the container small).
    image: postgres:16-alpine

    # "container_name" gives this container a friendly name
    # so we can reference it in logs and commands.
    container_name: adsiq_postgres

    # "restart: unless-stopped" means:
    # - If the container crashes → restart it automatically
    # - If YOU stop it with `docker compose down` → stay stopped
    # This mimics production behavior.
    restart: unless-stopped

    # "environment" sets environment variables INSIDE the container.
    # PostgreSQL reads these to create the database on first run.
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-adsiq_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-adsiq_pass}
      POSTGRES_DB: ${POSTGRES_DB:-adsiq_db}
      # 📖 ${VAR:-default} means: use the .env file value,
      #    OR fall back to the default after :- if not set.
      #    This makes the app work even without a .env file.

    # "ports" maps: HOST_PORT:CONTAINER_PORT
    # "5432:5432" means: your Mac's port 5432 → container's port 5432
    # So you can connect with: psql -h localhost -p 5432
    ports:
      - "5432:5432"

    # "volumes" persist data OUTSIDE the container.
    # Without this, ALL DATA IS LOST when the container stops!
    # postgres_data:/var/lib/postgresql/data means:
    #   Save PostgreSQL's data files in a Docker-managed volume
    #   called "postgres_data" (defined at the bottom of this file).
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # We also mount an init script to seed demo data on first run:
      - ./backend/init_db.sql:/docker-entrypoint-initdb.d/init.sql

    # "healthcheck" lets Docker know when PostgreSQL is READY.
    # Other services can wait for this before starting.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-adsiq_user} -d ${POSTGRES_DB:-adsiq_db}"]
      interval: 10s   # Check every 10 seconds
      timeout: 5s     # Fail if no response in 5 seconds
      retries: 5      # Retry 5 times before marking as unhealthy

    # "networks" puts this container on our private network
    networks:
      - adsiq_network

  # ----------------------------------------------------------
  # ⚡ SERVICE 2: Redis
  # ----------------------------------------------------------
  # Redis is an in-memory key-value store. Lightning fast.
  # We use it for THREE things:
  #   1. Caching: Store API responses so we don't re-query DB
  #   2. WebSocket Pub/Sub: Broadcast agent updates in real-time
  #   3. Celery Broker: Queue background tasks (e.g., run agent)
  redis:
    image: redis:7-alpine
    container_name: adsiq_redis
    restart: unless-stopped

    # Redis command flags:
    # --appendonly yes → Enable persistence (data survives restarts)
    # --maxmemory 256mb → Limit Redis to 256MB RAM
    # --maxmemory-policy allkeys-lru → When full, evict least-recently-used keys
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru

    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - adsiq_network

  # ----------------------------------------------------------
  # 🐍 SERVICE 3: FastAPI Backend
  # ----------------------------------------------------------
  # Our Python API server. Handles all business logic,
  # AI agent orchestration, and database operations.
  backend:
    # "build" means: don't use a pre-built image, BUILD one
    # from our own Dockerfile at ./backend/Dockerfile
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: adsiq_backend
    restart: unless-stopped

    # "env_file" loads ALL variables from .env into the container.
    # This is how our app gets OPENAI_API_KEY, POSTGRES_URL, etc.
    env_file:
      - .env

    # Override specific env vars for Docker networking.
    # Inside Docker, services talk by SERVICE NAME, not localhost.
    # So "localhost:5432" becomes "db:5432" (the service name above).
    environment:
      POSTGRES_URL: postgresql://${POSTGRES_USER:-adsiq_user}:${POSTGRES_PASSWORD:-adsiq_pass}@db:5432/${POSTGRES_DB:-adsiq_db}
      REDIS_URL: redis://redis:6379/0

    ports:
      - "8000:8000"

    # "volumes" for hot-reloading during development.
    # ./backend:/app means: sync your local ./backend folder
    # with /app inside the container in real-time.
    # So when you edit a .py file, the server auto-reloads!
    volumes:
      - ./backend:/app

    # "depends_on" with condition means:
    # Don't start backend until db AND redis are healthy.
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

    networks:
      - adsiq_network

  # ----------------------------------------------------------
  # ⚛️  SERVICE 4: Next.js Frontend
  # ----------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: adsiq_frontend
    restart: unless-stopped

    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_WS_URL: ws://localhost:8000

    ports:
      - "3000:3000"

    volumes:
      - ./frontend:/app
      # 📖 This line prevents the container's node_modules
      # from being overwritten by your local (empty) folder:
      - /app/node_modules

    depends_on:
      - backend

    networks:
      - adsiq_network

# ============================================================
# VOLUMES — Named persistent storage
# ============================================================
# These are Docker-managed folders that survive container restarts.
# Data written here is NOT lost when you run `docker compose down`.
# (Use `docker compose down -v` to also delete volumes.)
volumes:
  postgres_data:   # Stores all PostgreSQL database files
  redis_data:      # Stores Redis append-only log for persistence

# ============================================================
# NETWORKS — Private communication channel
# ============================================================
# All services on the same network can reach each other
# by their service name (e.g., backend calls "db:5432").
# Services NOT on this network cannot reach them — security!
networks:
  adsiq_network:
    driver: bridge
    # "bridge" = standard Docker networking mode.
    # Creates an isolated network that containers join.
